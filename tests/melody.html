<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melody checks</title>
<link rel="icon" href="../assets/img/favicon.png">
<style>body{max-width:900px;margin:48px auto;padding:0 24px;font:16px/1.7 system-ui}pre{white-space:pre-wrap}</style>
<h1>Melody checks</h1><pre id="results">Running…</pre>
<script type="module">
  import { checkMelody } from './melody.test.mjs';
  try {
    const sequence = await (await fetch('../scope/sequence.json')).json();
    const results = checkMelody(sequence);
    document.querySelector('#results').textContent = results.map(s => 'PASS ' + s).join('\n') + `\n\n${results.length} checks passed`;
    document.body.dataset.result = 'pass';
  } catch (error) {
    document.querySelector('#results').textContent = error.stack;
    document.body.dataset.result = 'fail';
  }
</script>
